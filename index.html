<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Você me ama?</title>

<!-- Fonte pixel -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #ffd6e7;
    font-family: Arial;
    overflow: hidden;
}

/* Centralização */
.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

/* BALÃO */
.balao {
    background: #ff4da6;
    color: white;
    padding: 30px 20px;
    border-radius: 25px;
    position: relative;
    font-family: 'Press Start 2P', cursive;
    font-size: 16px;
    text-align: center;
    max-width: 80%;
    box-shadow: 4px 4px 0px #d63384;
}

/* rabinho do balão */
.balao::after {
    content: "";
    position: absolute;
    bottom: -20px;
    left: 30px;
    border-width: 20px 20px 0;
    border-style: solid;
    border-color: #ff4da6 transparent;
}

/* Botões */
.botoes {
    margin-top: 40px;
}

button {
    padding: 12px 20px;
    font-size: 14px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    margin: 10px;
}

/* SIM */
#simBtn {
    background-color: #ff4da6;
    color: white;
}

/* NÃO */
#naoBtn {
    background-color: white;
    color: #ff4da6;
    position: absolute;
}

/* Corações */
.heart {
    position: absolute;
    animation: subir 5s linear infinite;
}

@keyframes subir {
    0% { transform: translateY(100vh); opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

/* FINAL */
#final {
    display: none;
    font-family: 'Press Start 2P', cursive;
    color: white;
    font-size: 20px;
    text-align: center;
}

/* RESPONSIVO */
@media (max-width: 600px) {
    .balao {
        font-size: 12px;
        padding: 20px;
    }

    button {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="balao" id="pergunta">
        💖 VOCÊ ME AMA? 💖
    </div>

    <div class="botoes">
        <button id="simBtn" onclick="aceitou()">Sim</button>
        <button id="naoBtn" ontouchstart="fugir()" onmouseover="fugir()">Não</button>
    </div>

    <div id="final">
        💖 EU SABIA!!! 💖 😏
    </div>

</div>

<!-- Música -->
<audio id="musica" loop>
    <source src="musica.mp3">
</audio>

<script>
let tamanho = 14;

function fugir() {
    let nao = document.getElementById("naoBtn");
    let sim = document.getElementById("simBtn");

    nao.style.left = Math.random() * (window.innerWidth - 80) + "px";
    nao.style.top = Math.random() * (window.innerHeight - 50) + "px";

    tamanho += 2;
    sim.style.fontSize = tamanho + "px";
}

function aceitou() {
    document.getElementById("pergunta").style.display = "none";
    document.querySelector(".botoes").style.display = "none";

    document.getElementById("final").style.display = "block";
    document.getElementById("musica").play();

    explodir();
}

function criarCoracao() {
    let c = document.createElement("div");
    c.classList.add("heart");
    c.innerText = "💖";

    c.style.left = Math.random() * 100 + "vw";
    c.style.fontSize = (Math.random() * 20 + 10) + "px";

    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
}

setInterval(criarCoracao, 300);

function explodir() {
    for (let i = 0; i < 80; i++) {
        setTimeout(() => {
            let c = document.createElement("div");
            c.innerText = "💖";
            c.style.position = "absolute";
            c.style.left = "50%";
            c.style.top = "50%";

            let x = (Math.random() - 0.5) * 600;
            let y = (Math.random() - 0.5) * 600;

            c.style.transform = `translate(${x}px, ${y}px)`;

            document.body.appendChild(c);
            setTimeout(() => c.remove(), 2000);
        }, i * 20);
    }
}
</script>

</body>
</html>
