<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Você me ama?</title>

<!-- Fonte pixel -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(135deg, #ff9ecf, #ffc0cb);
    font-family: Arial;
    text-align: center;
}

h1 {
    margin-top: 120px;
    font-size: 24px;
    color: white;
    font-family: 'Press Start 2P', cursive;
    text-shadow: 3px 3px #ff4da6;
}

button {
    padding: 15px 25px;
    font-size: 16px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    margin: 10px;
}

#simBtn {
    background-color: #ff4da6;
    color: white;
    position: relative;
}

#naoBtn {
    background-color: white;
    color: #ff4da6;
    position: absolute;
}

.heart {
    position: absolute;
    animation: subir 5s linear infinite;
}

@keyframes subir {
    0% { transform: translateY(100vh); opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

#final {
    display: none;
    font-size: 30px;
    color: white;
    margin-top: 150px;
    font-family: 'Press Start 2P', cursive;
}
</style>
</head>

<body>

<h1 id="pergunta">💖 VOCÊ ME AMA? 💖</h1>

<button id="simBtn" onclick="aceitou()">Sim</button>
<button id="naoBtn" onmouseover="fugir()">Não</button>

<h1 id="final">💖 EU SABIA!!! 💖 😏</h1>

<audio id="musica" loop>
<source src="musica.mp3">
</audio>

<script>
let tamanho = 16;

function fugir() {
    let nao = document.getElementById("naoBtn");
    let sim = document.getElementById("simBtn");

    nao.style.left = Math.random() * (window.innerWidth - 100) + "px";
    nao.style.top = Math.random() * (window.innerHeight - 50) + "px";

    tamanho += 3;
    sim.style.fontSize = tamanho + "px";
}

function aceitou() {
    document.getElementById("pergunta").style.display = "none";
    document.getElementById("simBtn").style.display = "none";
    document.getElementById("naoBtn").style.display = "none";

    document.getElementById("final").style.display = "block";
    document.getElementById("musica").play();

    explodir();
}

function criarCoracao() {
    let c = document.createElement("div");
    c.classList.add("heart");
    c.innerText = "💖";

    c.style.left = Math.random() * 100 + "vw";
    c.style.fontSize = (Math.random() * 20 + 10) + "px";

    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
}

setInterval(criarCoracao, 300);

function explodir() {
    for (let i = 0; i < 80; i++) {
        setTimeout(() => {
            let c = document.createElement("div");
            c.innerText = "💖";
            c.style.position = "absolute";
            c.style.left = "50%";
            c.style.top = "50%";

            let x = (Math.random() - 0.5) * 600;
            let y = (Math.random() - 0.5) * 600;

            c.style.transform = `translate(${x}px, ${y}px)`;

            document.body.appendChild(c);
            setTimeout(() => c.remove(), 2000);
        }, i * 20);
    }
}
</script>

</body>
</html>
